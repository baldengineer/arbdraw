name: Release Python bridge

on:
  push:
    tags:
      - "python-bridge-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out OWON adapter
        uses: actions/checkout@v7
        with:
          repository: baldengineer/owon-multicomp-awg-python-waveform-importer
          ref: 2bb28827554365947058c6800e92a170ce86e149
          path: adapter-sources/owon

      - name: Check out Rigol adapter
        uses: actions/checkout@v7
        with:
          repository: baldengineer/rigol-awg-python-importer
          ref: 9b73dbd03ca19af192516bb69ab5b08de9f4afc4
          path: adapter-sources/rigol

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check out TekScope adapter
        uses: actions/checkout@v7
        with:
          repository: baldengineer/tekscope-arbdraw-adapter
          ref: dec4bc24882a8ccb5c5a421832eefa11632f4da4
          path: adapter-sources/tekscope

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install bridge, TekScope adapter, and build tools
        run: python -m pip install build -e . -e adapter-sources/tekscope

      - name: Validate tag and package version
        if: github.ref_type == 'tag'
        shell: python
        run: |
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          from python_bridge import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"python-bridge-v{__version__}"
          if tag != expected:
              raise SystemExit(f"Tag {tag!r} does not match package version {expected!r}")

      - name: Test bridge
        env:
          ARBDRAW_REQUIRE_TEKSCOPE: '1'
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Test TekScope adapter
        run: python -m unittest discover -s adapter-sources/tekscope/tests -p "test_*.py"

      - name: Test web app and documentation
        run: node --test tests/*.test.js

      - name: Build bridge and adapter distributions
        run: >-
          python packaging/build_release.py
          --owon-source adapter-sources/owon
          --rigol-source adapter-sources/rigol
          --tekscope-source adapter-sources/tekscope

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Verify clean installation and adapter discovery
        run: python packaging/check_release.py dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: arbdraw-python-bridge-with-adapters
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "ArbDraw Python bridge v${GITHUB_REF_NAME#python-bridge-v}"
          --notes-file packaging/RELEASE_NOTES.md
