name: Release Python bridge

on:
  push:
    tags:
      - "python-bridge-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out OWON adapter
        uses: actions/checkout@v7
        with:
          repository: baldengineer/owon-multicomp-awg-python-waveform-importer
          ref: 2bb28827554365947058c6800e92a170ce86e149
          path: adapter-sources/owon

      - name: Check out Rigol adapter
        uses: actions/checkout@v7
        with:
          repository: baldengineer/rigol-awg-python-importer
          ref: 68d325745537cd3ba000b5684d8440a43e8cd420
          path: adapter-sources/rigol

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Validate tag and package version
        if: github.ref_type == 'tag'
        shell: python
        run: |
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          from python_bridge import __version__

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"python-bridge-v{__version__}"
          if tag != expected:
              raise SystemExit(f"Tag {tag!r} does not match package version {expected!r}")

      - name: Test bridge
        run: python -m unittest discover -s tests -p "test_python_bridge.py"

      - name: Build bridge and adapter distributions
        run: >-
          python packaging/build_release.py
          --owon-source adapter-sources/owon
          --rigol-source adapter-sources/rigol

      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*.whl dist/*.tar.gz

      - name: Verify clean installation and adapter discovery
        run: python packaging/check_release.py dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: arbdraw-python-bridge-with-adapters
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "ArbDraw Python bridge v${GITHUB_REF_NAME#python-bridge-v}"
          --notes-file packaging/RELEASE_NOTES.md
